name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master # Triggers on push to either main or master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install NPM Dependencies
      run: npm ci

    - name: 🔨 Build Frontend (Vite)
      run: npm run build

    - name: 🚀 FTP Deploy to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /licenses.worthx.net/
        # We exclude folders that shouldn't be uploaded to keep the deployment fast and secure
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          .env
          .env.example
